<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 회원가입</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-BQTDGG8EHJ"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-BQTDGG8EHJ");
    </script>
  </head>
  <body>
    <main class="auth auth--signup">
      <div class="auth__container">
        <h1>
          <a href="/">
            <img src="./assets/logo-lg.svg" alt="판다마켓" />
          </a>
        </h1>

        <div class="auth__wrapper">
          <form class="auth-form" action="#" method="post">
            <fieldset>
              <legend class="sr-only">로그인 정보 입력</legend>

              <div class="auth-form__field">
                <label
                  for="email"
                  class="auth-form__label text-2lg-bold auth-form__label--signup"
                  >이메일</label
                >
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="text-lg-regular auth-form__input"
                  placeholder="이메일을 입력해주세요"
                  required
                />
              </div>

              <div class="auth-form__field">
                <label
                  for="nickname"
                  class="auth-form__label text-2lg-bold auth-form__label--signup"
                  >닉네임</label
                >
                <input
                  type="text"
                  id="nickname"
                  name="nickname"
                  class="text-lg-regular auth-form__input"
                  placeholder="닉네임을 입력해주세요"
                  required
                />
              </div>

              <div class="auth-form__field">
                <label
                  for="password"
                  class="auth-form__label text-2lg-bold auth-form__label--signup"
                  >비밀번호</label
                >
                <div class="auth-form__input-wrapper">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    class="text-lg-regular auth-form__input"
                    placeholder="비밀번호를 입력해주세요"
                    required
                  />
                  <button type="button" class="auth-form__visibility-btn">
                    <span class="sr-only">입력한 비밀번호 보기</span>
                    <img src="./assets/ic-visibility-off.svg" alt="" />
                  </button>
                </div>
              </div>

              <div class="auth-form__field">
                <label
                  for="confirm-password"
                  class="auth-form__label text-2lg-bold auth-form__label--signup"
                  >비밀번호 확인</label
                >
                <div class="auth-form__input-wrapper">
                  <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    class="text-lg-regular auth-form__input"
                    placeholder="비밀번호를 다시 한 번 입력해주세요"
                    required
                  />
                  <button type="button" class="auth-form__visibility-btn">
                    <span class="sr-only">입력한 비밀번호 보기</span>
                    <img src="./assets/ic-visibility-off.svg" alt="" />
                  </button>
                </div>
              </div>

              <button
                type="submit"
                class="btn-base auth-form__submit-btn auth-form__submit-btn--signup"
              >
                회원가입
              </button>
            </fieldset>
          </form>

          <section class="social-login">
            <h2 class="text-lg-medium social-login__title">간편 로그인하기</h2>
            <div class="social-login__links">
              <a
                href="https://www.google.com/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="sr-only">구글</span>
                <img src="/assets/ic-google.svg" alt="" aria-hidden="true" />
              </a>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <span class="sr-only">카카오</span>
                <img src="/assets/ic-kakao.svg" alt="" aria-hidden="true" />
              </a>
            </div>
          </section>

          <p class="text-md-medium">
            이미 회원이신가요?
            <a href="./login.html" class="auth-switch__link">로그인 </a>
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
