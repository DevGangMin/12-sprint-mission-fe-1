<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 - 판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/signup.css" />
    <link rel="stylesheet" href="./css/variable.css" />
  </head>
  <body>
    <div class="signup-wrapper">
      <header>
        <a href="/"><img src="./images/pm_logo.png" class="pm-logo" /></a>
      </header>

      <main class="signup-container">
        <form action="#" method="POST" class="signup-container">
          <div class="input-container">
            <p class="input-label">이메일</p>
            <input
              type="email"
              class="signup-input"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="input-container">
            <p class="input-label">닉네임</p>
            <input
              type="text"
              class="signup-input"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="input-container">
            <p class="input-label">비밀번호</p>
            <div class="input-container pw-input">
              <input
                type="password"
                class="signup-input"
                placeholder="비밀번호를 입력해주세요"
              />
              <div class="btn-pw-visible">
                <img
                  src="./images/btn_visibility_off_24px.svg"
                  alt="비밀번호 표시"
                  class="ic-visibility-off"
                />
              </div>
            </div>
          </div>
          <div class="input-container">
            <p class="input-label">비밀번호 확인</p>
            <div class="input-container pw-input">
              <input
                type="password"
                class="signup-input"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <div class="btn-pw-visible">
                <img
                  src="./images/btn_visibility_off_24px.svg"
                  alt="비밀번호 표시"
                  class="ic-visibility-off"
                />
              </div>
            </div>
          </div>
          <button type="submit" class="signup-submit">회원가입</button>
        </form>
        <div class="social-login">
          <div class="social-login-container">
            <p>간편 로그인하기</p>
            <div class="social-login-logo-container">
              <a href="https://www.google.com/"
                ><img src="./images/ic_google.png" class="social-logo-img"
              /></a>
              <a href="https://www.kakaocorp.com/page/"
                ><img src="./images/ic_kakaotalk.png" class="social-logo-img"
              /></a>
            </div>
          </div>
        </div>

        <div class="login-notice">
          <p>
            이미 회원이신가요?
            <a href="/login.html" class="login-link"> 로그인</a>
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
