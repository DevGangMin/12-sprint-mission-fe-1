<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="../../style/login.css" />
  </head>
  <body>
    <a href="/sprintMission1/src/index.html"
      ><img src="/sprintMission2/resource/logo.png"
    /></a>
    <form>
      <div class="email">
        <p class="section">이메일</p>
        <input
          type="text"
          placeholder="이메일을 입력해주세요"
          class="text-box"
        />
      </div>
      <div class="pw">
        <p class="section">비밀번호</p>
        <div class="input-wrapper">
          <input
            type="password"
            placeholder="비밀번호를 입력해주세요"
            class="text-box"
          />
          <img
            src="/sprintMission2/resource/btn_visibility_off_24px.svg"
            class="eye-icon"
          />
        </div>
      </div>
      <a href="../index.html"><button class="login-btn">로그인</button></a>

      <section class="sample-login-box">
        <p class="sample-login-text">간편 로그인하기</p>
        <div class="social-img">
          <a href="https://www.google.com/"
            ><img src="/sprintMission2/resource/login_google.png"
          /></a>
          <a href="https://www.kakaocorp.com/page/"
            ><img src="/sprintMission2/resource/login_kakao.png"
          /></a>
        </div>
      </section>
      <div class="signup-box">
        <p class="login-footer-text">판다마켓이 처음이신가요?</p>
        <a href="../signup/signup.html" class="signup-text">회원가입</a>
      </div>
    </form>
  </body>
</html>
