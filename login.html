<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="판다마켓 | 일상에서 모든 물건을 거래해보세요."
    />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="login-container">
      <section>
        <div class="login-container-inner">
          <div class="column">
            <a href="/"
              ><img src="./img/common/logo_large.png" alt="메인 페이지로 이동"
            /></a>
          </div>
          <div class="column">
            <form method="post" action="#" name="login">
              <label class="txt_login" for="email">이메일</label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="이메일을 입력해주세요"
                required
              />
              <label class="txt_login" for="password">비밀번호</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="비밀번호를 입력해주세요"
                required
              />
              <button type="submit" class="btn btn_large">로그인</button>
            </form>
          </div>
          <div class="login-sns">
            <span>간편 로그인하기</span>
            <div class="sns-buttons">
              <a href="https://google.com">
                <img src="./img/login/logo_google.png" alt="구글 로그인" />
              </a>

              <a class="btn-kakao" href="https://www.kakaocorp.com/page/">
                <img src="./img/login/logo-kakao.png" alt="카카오 로그인" />
              </a>
            </div>
          </div>
          <div>
            <span>판다마켓이 처음이신가요?</span>
            <a href="./signup.html">회원가입</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
