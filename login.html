<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-main1">
      <!-- 판다마켓 제목 -->
      <div class="login-main2">
        <div class="imggps">
          <img src="img/판다 얼굴.png" alt="판다얼굴" class="imgsize1" />
          <p class="padaname">판다마켓</p>
        </div>

        <!-- 로그인 폼 -->
        <div class="loginpass">
          <form action="/login" method="POST">
            
            <div class="entermain">
              <label for="user-id" class="entername">이메일</label>
              <input type="text" id="user-id" name="userId" placeholder="이메일을 입력해주세요"  class="enter"/>
            </div>

            <div class="entermain">
              <label for="user-pw" class="entername">비밀번호</label>
              <input type="password" id="user-pw" name="userPassword" placeholder="비밀번호를 입력해주세요"  class="enter"/>
            </div>
            
            

            <button type="submit" class="loginbutton">로그인</button>
          </form>
          
          <!-- 간편 로그인 -->
          <div class="gap">
            <div class="simplelogin1">
              <div class="simplelogin2">
                <div class="simplelogin-name">간편 로그인하기</div>

                <div class="sns-img">
                  <a href=“https://www.google.com” target="_blank"
                    ><img src="img/google.png" alt="구글" class="googleimg"
                  /></a>
                  <a href="https://www.kakaocorp.com" target="_blank"
                    ><div class="kakaotalkback"><img src="img/kakaotalk.png" alt="카카오톡" class="kakaotalkimg"
                  /></div></a>
                </div>
              </div>
            </div>
            <!-- 회원가입 페이지로 가기 -->
            <div class="signup">
              <div class="signupname">판다마켓이 처음이신가요?</div>
              <a href="/signup.html" target="_blank" class="signuplink">회원가입</a>
            </div>
          </div>

        </div>

        
      </div>
    </main>
  </body>
</html>
