<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <header class="header">
      <h1>
        <a href="/">
          <img src="./assets/logo-lg.png" alt="판다마켓" />
        </a>
      </h1>
    </header>

    <main>
      <form class="login" action="#" method="post">
        <fieldset>
          <legend class="sr-only">로그인 정보 입력</legend>

          <div class="login__field">
            <label for="email" class="text-lg-semibold login__label"
              >이메일</label
            >
            <input
              type="email"
              id="email"
              name="email"
              class="text-lg-regular login__input"
              placeholder="이메일을 입력해주세요"
              required
            />
          </div>

          <div class="login__field">
            <label for="password" class="text-lg-semibold login__label"
              >비밀번호</label
            >
            <div class="login__input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="text-lg-regular login__input"
                placeholder="비밀번호를 입력해주세요"
                required
              />
              <button type="button" class="login__toggle-btn">
                <span class="sr-only">입력한 비밀번호 보기</span>
                <img src="./assets/login-btn-visibility-off.svg" alt="" />
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="btn-base text-xl-semibold login__submit-btn"
          >
            로그인
          </button>
        </fieldset>
      </form>

      <section class="social-login">
        <h3 class="text-lg-medium social-login__title">간편 로그인하기</h3>
        <div class="social-login__links">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="sr-only">구글</span>
            <img src="/assets/ic-google.png" alt="" aria-hidden="true" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="sr-only">카카오</span>
            <img src="/assets/ic-kakao.png" alt="" aria-hidden="true" />
          </a>
        </div>
      </section>

      <p class="text-md-medium signup-prompt">
        판다마켓이 처음이신가요?
        <a href="./signup.html"> 회원가입 </a>
      </p>
    </main>
  </body>
</html>
