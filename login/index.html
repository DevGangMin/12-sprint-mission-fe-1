<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 | 판다마켓</title>
    <link rel="icon" href="/static/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://unpkg.com/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css"
    />
    <link rel="stylesheet" href="/static/css/reset.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
  </head>
  <body>
    <div class="inner-form">
      <div class="big-logo"></div>

      <form action="" method="post">
        <fieldset>
          <div>
            <label for="member-email">이메일</label>
            <input type="text" name="email" id="member-email" />
          </div>
          <div>
            <label for="member-password">비밀번호</label>
            <input type="text" name="password" id="member-password" />
          </div>
        </fieldset>

        <div class="btn-group">
          <button type="submit">로그인</button>
        </div>
      </form>

      <section id="social-login">
        <h2>간편 로그인하기</h2>
      </section>
    </div>
  </body>
</html>
