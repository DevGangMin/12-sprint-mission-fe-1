            src="image/Img_home_02.png"
            alt="두번째 메인 이미지"

        </div>
      </section>
      <section class="section">
        <div class="main-container">
            <img
            class="main-img"
            src="image/Img_home_03.png"
            alt="세번째 메인 이미지"
          />
            <div class="main-text">
                <h2 class="point">Register</h2>
                <h1>판매를 원하는<br />상품을 등록하세요</h1>

            </div>
