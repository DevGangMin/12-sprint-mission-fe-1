<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 내비바 -->
    <nav class="navbar">
      <div class="nav">
        <div>
          <a href="/"><img src="img/logo.png" alt="판다마켓" class="logo" /></a>
        </div>
        <div>
          <a href="/login.html" target="_blank">
            <button class="login-btn">로그인</button>
          </a>
        </div>
      </div>
    </nav>

    <!-- 메인 -->
    <main>
      <!-- 베너1 -->
      <div class="banner">
        <div class="banner-main">
          <div class="banner-frist">
            <span class="banner-name"
              >일상의 모든 물건을<br />거래해 보세요</span
            >
            <a href="/items" target="_blank">
              <button class="looking-btn">구경하러 가기</button>
            </a>
          </div>
          <div>
            <img
              src="img/Img_home_top.png"
              alt="판다가 언덕에 장바구니를 들고 서있다"
              class="imgsize"
            />
          </div>
        </div>
      </div>
      <!-- 베너2 -->
      <div class="banner1">
        <div class="banner1-main">
          <div>
            <img
              src="img/Frame 2608833.png"
              alt="판다뒷모습 옷"
              class="img-main"
            />
          </div>
          <div class="name-box">
            <span class="name-blue">Hot item</span>
            <span class="name-main">인기 상품을<br />확인해 보세요</span>
            <span class="name-ex"
              >가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</span
            >
          </div>
        </div>
      </div>
      <!-- 베너3 -->
      <div class="banner1">
        <div class="banner1-main banner1-reverse">
          <div>
            <img src="img/Img_home_02.png" alt="돋보기" class="img-main" />
          </div>
          <div class="name-box namebox_reverse">
            <span class="name-blue">Search</span>
            <span class="name-main">구매를 원하는 상품을<br />검색하세요</span>
            <span class="name-ex"
              >구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요</span
            >
          </div>
        </div>
      </div>
      <!-- 베너4 -->
      <div class="banner1">
        <div class="banner1-main">
          <div>
            <img
              src="img/Frame 2608833.png"
              alt="판다뒷모습 옷"
              class="img-main"
            />
          </div>
          <div class="name-box">
            <span class="name-blue">Register</span>
            <span class="name-main">판매를 원하는<br />상품을 등록하세요</span>
            <span class="name-ex"
              >어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</span
            >
          </div>
        </div>
      </div>
      <!-- 베너5 -->
      <div class="banner">
        <div class="banner2-main">
          <div>
            <span class="banner-name">
              믿을 수 있는<br />
              판다마켓 중고 거래
            </span>
          </div>
          <div>
            <img
              src="img/Img_home_bottom.png"
              alt="판다 두마리가 장바구니를 들고있다"
            />
          </div>
        </div>
      </div>
    </main>

    <!-- 푸터 -->
    <footer>
      <div class="footer1">
        <div class="footer-container">
          <div class="footer-left">©codeit - 2024</div>

          <!-- FAQ -->
          <div>
            <ul class="footer-menu">
              <li><a href="/privacy" target="_blank">Privacy Policy</a></li>
              <li><a href="/faq" target="_blank">FAQ</a></li>
            </ul>
          </div>

          <!-- sns -->
          <div class="footer-sns">
            <a href="https://facebook.com" target="_blank">
              <img
                src="img/ic_facebook.png"
                alt="페이스북"
                class="footer-img"
              />
            </a>
            <a href="https://twitter.com" target="_blank"
              ><img src="img/ic_twitter.png" alt="트위터" class="footer-img"
            /></a>
            <a href="https://youtube.com" target="_blank"
              ><img src="img/ic_youtube.png" alt="유튜브" class="footer-img"
            /></a>
            <a href="https://instagram.com" target="_blank"
              ><img
                src="img/ic_instagram.png"
                alt="인스타그램"
                class="footer-img"
            /></a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
