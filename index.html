<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- GNB -->
    <header class="header">
      <div class="container">
        <a href="/index.html">
          <img src="img/logo.png" alt="로고" class="logo" />
        </a>
        <a href="/html/login.html">
          <button class="btn-login">로그인</button>
        </a>
      </div>
    </header>
    <!-- Hero -->
    <section class="top-hero">
      <div class="container">
        <div class="hero-content">
          <h1 class="content-copy">일상의 모든 물건을<br />거래해 보세요</h1>
          <button class="btn-primary">구경하러 가기</button>
        </div>
        <div class="hero-image">
          <img src="img/Img_home_top.png" alt="판다 캐릭터" />
        </div>
      </div>
    </section>
    <!-- 섹션 영역 -->
    <section class="section-features">
      <div class="container">
        <article class="feature-item">
          <div class="feature-img">
            <img src="img/Img_home_01.png" alt="" />
          </div>
          <div class="feature-text">
            <span><b>HOT ITEM</b></span>
            <h3>
              인기 상품을 <br />
              확인해 보세요
            </h3>
            <p>가장 HOT한 중고거래 물품을 <br />판다마켓에서 확인해 보세요</p>
          </div>
        </article>

        <article class="feature-item reverse">
          <div class="feature-img">
            <img src="img/Img_home_02.png" alt="" />
          </div>
          <div class="feature-text">
            <span><b>Search</b></span>
            <h3>구매를 원하는 <br />상품을 검색하세요</h3>
            <p>구매하고 싶은 물건은 검색해서 <br />쉽게 찾아보세요</p>
          </div>
        </article>

        <article class="feature-item">
          <div class="feature-img">
            <img src="img/Img_home_03.png" alt="" />
          </div>
          <div class="feature-text">
            <span><b>Register</b></span>
            <h3>
              판매를 원하는 <br />
              상품을 등록하세요
            </h3>
            <p>아껴 쓴 물건을 판매하고 싶을 때 상품을 <br />쉽게 등록하세요</p>
          </div>
        </article>
      </div>
    </section>
    <!-- Bottom -->
    <section class="bottom-hero">
      <div class="container">
        <div class="hero-content">
          <h1>믿을 수 있는<br />판다마켓 중고 거래</h1>
        </div>
        <div class="hero-image">
          <img src="img/Img_home_bottom.png" alt="판다들" />
        </div>
      </div>
    </section>
    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-left">
          <p>@codeit - 2024</p>

        <div class="footer-center">

        <div class="footer-right">

            target="_blank"

          <a
            href="https://twitter.com"
            target="_blank"
            rel="noopener noreferrer"

            target="_blank"
