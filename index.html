<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- GNB -->
  <div class="gnb">
    <div class="gnb-container">
      
      <!-- 좌측 로고 -->
      <a href="/" class="logo">
        <img src="images/index/logo.svg" alt="판다마켓 로고" class="logo-img"/>
        <span class="logo-text">판다마켓</span>
      </a>

      <!-- 로그인 -->
      <a href="/login" class="login-btn">로그인</a>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-container">
  
      <!-- 좌측 텍스트 영역 -->
      <div class="hero-text">
        <h1>
          일상의 모든 물건을<br />
          거래해 보세요
        </h1>
  
        <a href="/items" class="hero-btn">구경하러 가기</a>
      </div>
  
      <!-- 우측 이미지 -->
      <div class="hero-img">
        <img src="images/index/Img_home_top.svg" alt="판다 캐릭터" />
      </div>
  
    </div>
  </section>
  
  
  <!-- 첫 번째 main 영역 -->
  <section class="main-section">
    <div class="main-container">
      
      <!-- 이미지 영역 -->
      <div class="main-img">
        <img src="images/index/Img_home_01.svg" alt="인기 상품 이미지" />
      </div>
  
      <!-- 텍스트 영역 -->
      <div class="main-text">
        <span class="main-label">Hot item</span>
        <h2>인기 상품을<br />확인해 보세요</h2>
        <p>
          가장 HOT한 중고거래 물품을<br />
          판다 마켓에서 확인해 보세요
        </p>
      </div>
    </div>
  </section>
  
  <!-- 두 번째 영역 -->
  <section class="second-section">
    <div class="second-container">
      
      <!-- 텍스트 영역 -->
      <div class="second-text">
        <span class="second-label">Search</span>
        <h2>구매를 원하는<br />상품을 검색하세요</h2>
        <p>
          구매하고 싶은 물품은 검색해서<br />
          쉽게 찾아보세요
        </p>
      </div>

      <!-- 이미지 영역 -->
      <div class="second-img">
        <img src="images/index/Img_home_02.svg" alt="구매 검색 이미지" />
      </div>
  
    </div>
  </section>


  <!-- 세 번째 main 영역 -->
  <section class="third-section">
    <div class="third-container">
      
      <!-- 이미지 영역 -->
      <div class="third-img">
        <img src="images/index/Img_home_03.svg" alt="상품 등록 이미지" />
      </div>
  
      <!-- 텍스트 영역 -->
      <div class="third-text">
        <span class="third-label">Register</span>
        <h2>판매를 원하는<br />상품을 등록하세요</h2>
        <p>
          어떤 물건이든 판매하고 싶은 상품을<br />
          쉽게 등록하세요
        </p>
      </div>
  
    </div>
  </section>


  <!-- BOTTOM -->
  <section class="bottom">
    <div class="bottom-container">
      
      <!-- 텍스트 영역 -->
      <div class="bottom-text">
        <h1>
        믿을 수 있는<br />
        판다마켓 중고 거래
        </h1>
      </div>

      <!-- 이미지 영역 -->
      <div class="bottom-img">
        <img src="images/index/Img_home_bottom.svg" alt="믿을 수 있는 판다마켓 중고 거래를 표현한 판다 캐릭터 이미지" />
      </div>
  
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-row">
      <!-- left -->
      <p class="footer-copy">codeit-2024</p>
  
      <!-- center -->
      <nav class="footer-links" aria-label="footer links">
        <a class="footer-link" href="/privacy">Privacy Policy</a>
        <a class="footer-link" href="/faq">FAQ</a>
      </nav>
  
      <!-- right -->
      <div class="footer-sns" aria-label="social links">
        <a
          class="sns-link"
          href="https://www.facebook.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
        >
          <img src="images/index/ic_facebook.svg" alt="Facebook" />
        </a>
  
        <a
          class="sns-link"
          href="https://twitter.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Twitter"
        >
          <img src="images/index/ic_twitter.svg" alt="Twitter" />
        </a>
  
        <a
          class="sns-link"
          href="https://www.youtube.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube"
        >
          <img src="images/index/ic_youtube.svg" alt="YouTube" />
        </a>
  
        <a
          class="sns-link"
          href="https://www.instagram.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <img src="images/index/ic_instagram.svg" alt="Instagram" />
        </a>
      </div>
    </div>
  </footer>
