<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인 - 판다마켓</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <section class="login-container">
      <a href="/index.html" class="logo-wrapper">
        <img src="../img/logo.png" alt="판다마켓 로고" class="logo-img" />
      </a>

      <form class="login-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="userPassword">비밀번호</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="userPassword"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <button type="button" class="toggle-password">
              <img src="../img/eye-off.png" alt="비밀번호 보기" />
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">로그인</button>
      </form>

      <div class="easy-login">
        <span class="easy-login-header">간편 로그인하기</span>
        <span class="social-icons">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="../img/googlelogo.png" alt="구글" />
          </a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="../img/kakaologo.png" alt="카카오" />
          </a>
        </span>
      </div>

      <p class="signup-link">
        판다 마켓이 처음이신가요? <a href="signup.html">회원가입</a>
      </p>
    </section>
  </body>
</html>
