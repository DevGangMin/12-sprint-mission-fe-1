<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="resetsheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-LBWJ7TMEDX");
    </script>
  </head>
  <body>
    <div class="logo-container">
      <div>
        <a href="../index.html">
          <img class="logo" src="../images/login_logo.png" alt="로고" />
        </a>
      </div>
      <div class="login-box">
        <div class="email-wrap">
          <label for="email">이메일</label>
          <input
            id="email"
            name="nikname"
            type="text"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="pw-wrap">
          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="text"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>
        <button class="login-btn">
          <span>로그인</span>
        </button>
        <div class="easy-login-box">
          <div>
            <span class="text-easy-login">간편 로그인하기</span>
          </div>
          <div class="icon">
            <div>
              <a
                href="https://www.google.com/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img src="/images/icon/ic_google.png" alt="구글" />
              </a>
            </div>
            <div>
              <a
                href="https://www.kakaocorp.com/page/"
                target="_blank"
                rel="noopener noreferrer"
              >
                <img src="/images/icon/ic_kakao.png" />
              </a>
            </div>
          </div>
        </div>
        <div class="signup-wrap">
          <span>판다마켓이 처음이신가요?</span>
          <a href="/html/signup.html"> 회원가입</a>
        </div>
      </div>
    </div>
  </body>
</html>
