<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓-회원가입</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="signup-wrap">
      <a class="login-logo" href="/" alt="메인으로 이동">
        <img class="panda" src="../image/판다 얼굴.svg" />
        <div class="pandaLogo">판다마켓</div>
      </a>

      <section class="loginMain">
        <form class="login-form" action="#" method="post">
          <div class="input-group">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="input-group">
            <label for="nickname">닉네임</label>
            <input
              type="nickname"
              id="nickname"
              name="nickname"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="input-group">
            <label for="password">비밀번호</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
          </div>
          <div class="input-group">
            <label for="password-check">비밀번호 확인</label>
            <input
              type="password-check"
              id="password-check"
              name="password-check"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </div>
          <!-- 회원가입 버튼 -->
          <div class="login-button-group">
            <button type="button" class="login-btn">회원가입</button>
          </div>
        </form>

        <div class="auth-wrap">
          <h3>간편 로그인하기</h3>
          <div class="auth-btn">
            <a href="https://www.google.com/">
              <img src="../image/Component 2.png"
            /></a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="../image/Component 3.png"
            /></a>
          </div>
        </div>
        <div class="login-bottom">
          <h4>이미 회원이신가요?</h4>
          <a href="./login.html">로그인</a>
        </div>
      </section>
    </div>
  </body>
</html>
