<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="resetsheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-LBWJ7TMEDX");
    </script>
  </head>
  <body>
    <div class="signup-container">
      <div>
        <a href="/index.html">
          <img class="logo" src="../images/login_logo.png" alt="로고" />
        </a>
      </div>
      <div class="signup-box">
        <div class="email-wrap">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="text"
            placeholder="이메일을 입력해주세요"
          />
        </div>
        <div class="nikname-wrap">
          <label for="nikname">닉네임</label>
          <input
            id="nikname"
            name="nikname"
            type="text"
            placeholder="닉네임을 입력해주세요"
          />
        </div>
        <div class="pw-wrap">
          <label for="password">비밀번호</label>
          <input
            id="password"
            name="password"
            type="text"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>
        <div class="pw-check-wrap">
          <label for="password-check">비밀번호 확인</label>
          <input
            id="password-check"
            name="password-check"
            type="text"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
          />
        </div>
        <buttom class="signup-btn"> <span>회원가입</span></buttom>
        <div class="easy-login-box">
          <div><span>간편 로그인</span></div>
          <div class="icon">
            <a href="https://www.google.com/"
              ><img src="../images/icon/ic_google.png" alt="구글"
            /></a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="../images/icon/ic_kakao.png" alt="카카오" />
            </a>
          </div>
        </div>
        <div class="login-wrap">
          <span>이미 회원이신가요?</span>
          <a href="/html/login.html"> 로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
