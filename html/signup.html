<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>회원가입 - 판다마켓</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/signup.css" />
  </head>
  <body>
    <section class="login-container">
      <a href="../index.html" class="logo-wrapper">
        <img src="../img/logo.png" alt="판다마켓 로고" class="logo-img" />
      </a>

      <form class="login-form">
        <div class="form-group">
          <label for="email">이메일</label>
          <input
            type="email"
            id="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="nickname">닉네임</label>
          <input
            type="text"
            id="nickname"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div class="form-group">
          <label for="userPassword">비밀번호</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="userPassword"
              placeholder="비밀번호를 입력해주세요"
              required
            />
            <button type="button" class="toggle-password">
              <img src="../img/eye-off.png" alt="비밀번호 보기" />
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="passwordCheck">비밀번호 확인</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="passwordCheck"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
              required
            />
            <button type="button" class="toggle-password">
              <img src="../img/eye-off.png" alt="비밀번호 보기" />
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">회원가입</button>
      </form>

      <div class="easy-login">
        <span class="easy-login-header">간편 로그인하기</span>
        <div class="social-icons">
          <a href="#"><img src="../img/googlelogo.png" alt="구글" /></a>
          <a href="#"><img src="../img/kakaologo.png" alt="카카오" /></a>
        </div>
      </div>

      <p class="signup-link">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </p>
    </section>
  </body>
</html>
